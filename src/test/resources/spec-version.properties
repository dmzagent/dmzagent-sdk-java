# Pins the spec version this SDK build conforms to. Read by
# ContractTests to locate the contract-test corpus on disk.
#
# `spec.version` MUST match the value of <concordex.spec.version>
# in pom.xml and the VERSION file in the checked-out spec repo.
# The spec-conformance CI workflow fails loud if these drift.
spec.version=0.5.0

# Default path the contract-test runner resolves to. CI overrides
# via the CONCORDEX_SPEC_PATH environment variable (the spec repo
# is checked out into a sibling directory at runtime).
spec.path.default=../concordex-sdk-spec
