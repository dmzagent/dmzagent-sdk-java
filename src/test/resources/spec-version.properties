# Where the contract-test corpus lives on disk. CI overrides this with the
# DMZAGENT_SPEC_PATH environment variable (the spec repo is checked out into
# a sibling directory at runtime).
#
# This file used to also carry `spec.version`, pinned at 0.6.0, above a
# comment claiming it MUST match <dmzagent.spec.version> in pom.xml and the
# spec repo's VERSION file, and that "the spec-conformance CI workflow fails
# loud if these drift". Nothing read the value — specRoot() takes only
# spec.path.default — so it sat at 0.6.0 while the pom moved to 0.8.0 and
# then 0.8.1, and nothing failed at all. The version now comes from
# SpecVersion.VALUE, filtered from the pom at build time, so there is one
# copy rather than a second one free to drift.
spec.path.default=../dmzagent-sdk-spec
