name: spec-conformance

# Runs the spec contract-test corpus against this SDK build and
# reports the result as a GitHub status check named
# `spec-conformance/<spec-version>` — the value the spec repo's
# promote.yml workflow polls before dispatching publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  conformance:
    name: spec ${{ vars.CONCORDEX_SPEC_VERSION || '0.5.0' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out SDK
        uses: actions/checkout@v4

      # Pin the spec repo to the version this SDK declares. The
      # pom.xml carries <concordex.spec.version>0.5.0</…>. CI reads
      # it back and uses it as the spec repo's git ref so drift
      # surfaces as a checkout failure.
      - name: Read pinned spec version
        id: spec
        run: |
          version=$(grep -oP '(?<=<concordex.spec.version>)[^<]+' pom.xml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned spec version: $version"

      - name: Check out concordex-sdk-spec
        uses: actions/checkout@v4
        with:
          repository: concordex/concordex-sdk-spec
          ref: v${{ steps.spec.outputs.version }}
          path: concordex-sdk-spec

      - name: Verify spec VERSION matches pin
        run: |
          got=$(cat concordex-sdk-spec/VERSION | tr -d '[:space:]')
          want=${{ steps.spec.outputs.version }}
          if [ "$got" != "$want" ]; then
            echo "spec VERSION='$got' does not match pin='$want'"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run conformance tests
        env:
          CONCORDEX_SPEC_PATH: ${{ github.workspace }}/concordex-sdk-spec
        run: mvn -B -ntp verify

      - name: Publish status check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              sha:     context.sha,
              state:   conclusion,
              context: 'spec-conformance/${{ steps.spec.outputs.version }}',
              description: conclusion === 'success'
                ? 'all corpora green'
                : 'one or more fixtures failed',
            });
