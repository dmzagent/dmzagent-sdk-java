name: spec-conformance

# Runs the spec contract-test corpus against this SDK build and
# reports the result as a GitHub status check named
# `spec-conformance/<spec-version>` — the value the spec repo's
# promote.yml workflow polls before dispatching publish.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  statuses: write

concurrency:
  group: spec-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    # A fixed name. This was `spec ${{ vars.DMZAGENT_SPEC_VERSION || '0.5.0' }}`
    # — a repo variable with a hardcoded fallback that read 0.5.0 while
    # pom.xml carried 0.6.0, so the job advertised a version it was not
    # testing against. The version that matters is published separately, as
    # the `spec-conformance/<version>` commit status below, and that one is
    # derived from the pin. A job name that also tries to carry the version
    # is a second copy that can go stale, which is what happened.
    name: spec conformance
    runs-on: ubuntu-latest

    steps:
      - name: Check out SDK
        uses: actions/checkout@v4

      # Pin the spec repo to the version this SDK declares. The
      # pom.xml carries <dmzagent.spec.version>. CI reads
      # it back and uses it for the spec repo's git ref so drift
      # surfaces as a checkout failure on release branches.
      - name: Read pinned spec version
        id: spec
        run: |
          version=$(grep -oP '(?<=<dmzagent.spec.version>)[^<]+' pom.xml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned spec version: $version"

      - name: Resolve spec checkout ref
        id: spec_ref
        env:
          VERSION: ${{ steps.spec.outputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/*|refs/tags/v*)
              echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT"
              echo "mode=release"  >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ref=main"      >> "$GITHUB_OUTPUT"
              echo "mode=dev"      >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check out dmzagent-sdk-spec
        uses: actions/checkout@v4
        with:
          repository: dmzagent/dmzagent-sdk-spec
          ref: ${{ steps.spec_ref.outputs.ref }}
          path: dmzagent-sdk-spec

      - name: Verify spec VERSION matches pin (release mode only)
        if: steps.spec_ref.outputs.mode == 'release'
        run: |
          got=$(cat dmzagent-sdk-spec/VERSION | tr -d '[:space:]')
          want=${{ steps.spec.outputs.version }}
          if [ "$got" != "$want" ]; then
            echo "::error::spec VERSION='$got' does not match pin='$want'"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run conformance tests
        env:
          DMZAGENT_SPEC_PATH: ${{ github.workspace }}/dmzagent-sdk-spec
        run: mvn -B -ntp verify

      - name: Publish status check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              sha:     context.sha,
              state:   conclusion,
              context: 'spec-conformance/${{ steps.spec.outputs.version }}',
              description: conclusion === 'success'
                ? 'all corpora green'
                : 'one or more fixtures failed',
            });
