name: publish

# Triggered by repository_dispatch from dmzagent-sdk-spec/promote.yml
# once spec-conformance is green across every SDK. The dispatched
# payload carries the version the spec repo wants released.
#
# Required secrets:
#   CENTRAL_USERNAME    Central Portal user-token username
#                       (central.sonatype.com → Account → Generate User Token).
#   CENTRAL_TOKEN       Central Portal user-token password.
#   GPG_PRIVATE_KEY     Armored private key for signing the artifact.
#   GPG_PASSPHRASE      Passphrase for GPG_PRIVATE_KEY.
#
# Required `id-token: write` and `contents: read` permissions for
# Sigstore-compatible provenance attestation in a future follow-up.

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.5.0)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish ${{ github.event.client_payload.version || inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out at release branch
        uses: actions/checkout@v4
        with:
          ref: release/v${{ github.event.client_payload.version || inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # configure-maven-settings: write Central Portal creds into ~/.m2/settings.xml
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase:  GPG_PASSPHRASE

      - name: Verify pom version matches dispatched version
        run: |
          want=${{ github.event.client_payload.version || inputs.version }}
          got=$(grep -oP '(?<=<version>)[^<]+' pom.xml | head -1)
          if [ "$got" != "$want" ]; then
            echo "pom.xml version='$got' does not match dispatched='$want'"
            exit 1
          fi

      - name: Publish to Maven Central (Central Portal)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN:    ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease deploy

      # central-publishing-maven-plugin runs with autoPublish=true and
      # waitUntil=published, so a successful `deploy` has:
      #   1. Uploaded the signed bundle to the Central Portal.
      #   2. Passed Central's validation (signatures, sources, javadoc, POM).
      #   3. Been published to Maven Central.
      # A validation failure leaves a FAILED deployment in the Portal (drop
      # it there) and exits non-zero; promote.yml then opens the yank issue
      # for any SDK that did publish.
